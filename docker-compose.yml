version: "3.8"

services:
  nas-homepage:
    build: .
    image: nas-homepage:latest
    container_name: nas-homepage
    restart: unless-stopped
    ports:
      - "8900:8000"
    volumes:
      - homepage-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LUCKY_ENABLED=true
      - LUCKY_BASE_URL=http://192.168.31.85:16601
      - LUCKY_API_TOKEN=5!aG@$H4FoDR@xJ6^EdetO#H^*sqSaiQ
      - DOCKER_ENABLED=true
      - DOCKER_SOCKET=/var/run/docker.sock
      - AUTO_DISCOVERY_INTERVAL=300
      - THEME_DEFAULT=dark
      - TRUSTED_PROXIES=[]
      - CUSTOM_LAN_RANGES=[]
    networks:
      - default

volumes:
  homepage-data:
    driver: local
